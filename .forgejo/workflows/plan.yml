# Runs `tofu plan` against the real state for every PR and posts the
# resource summary as a PR comment (updated on every push). Read-only: the
# job gets plan-only credentials (README "CI"), never runs apply, and plans
# with -lock=false so it never blocks a local apply.
name: tofu plan

on:
  pull_request:

# One plan per PR at a time; a new push cancels the old run.
concurrency:
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: docker
    timeout-minutes: 20
    env:
      # Backend + state encryption (README "State").
      PG_CONN_STR: ${{ secrets.PG_CONN_STR }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
      # AppRole tofu-plan: reads only the read-only tokens below.
      TF_VAR_vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
      TF_VAR_vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
      TF_VAR_proxmox_vault_secret: proxmox/plan
      TF_VAR_netbox_vault_secret: netbox/tofu-plan
      # Non-secret, must match the local terraform.tfvars (else cloud-init diffs).
      TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
      TF_VAR_target_node: ${{ vars.TARGET_NODE }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_vm_ssh_public_key: ${{ vars.VM_SSH_PUBLIC_KEY }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: https://github.com/opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: init
        run: tofu init -input=false

      - name: plan
        id: plan
        run: |
          set +e
          tofu plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: report
        if: always() && steps.plan.outputs.exitcode != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .forgejo/scripts/report.mjs pr plan.txt ${{ steps.plan.outputs.exitcode }}

      - name: fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
