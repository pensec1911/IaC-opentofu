# fmt / validate / tofu test with mocked providers — no state, no credentials.
# OpenTofu comes as a pinned release binary checked against its sha256 (no third-party
# action; the runner only serves the `docker` label).
name: tofu test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    timeout-minutes: 15
    env:
      TOFU_VERSION: 1.13.2
      TOFU_SHA256: ac05d9952662c7db28dd57e93f0a68018837bfdf9342384ec0987977c16a9645
    steps:
      - uses: actions/checkout@v4

      - name: install tofu
        run: |
          f="tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/$f" "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/$f"
          echo "${TOFU_SHA256}  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /usr/local/bin tofu
          tofu version

      - name: fmt check
        run: tofu fmt -check -recursive -diff

      - name: init
        run: tofu init -backend=false -input=false

      - name: validate
        run: tofu validate

      - name: test (fleet invariants, mocked providers)
        run: tofu test

      - name: test vm-instance module
        working-directory: modules/vm-instance
        run: |
          tofu init -backend=false -input=false
          tofu test

      - name: test vm-template module
        working-directory: modules/vm-template
        run: |
          tofu init -backend=false -input=false
          tofu test
